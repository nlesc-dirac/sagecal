name: CI

on:
  push: {}
  pull_request: {}

jobs:
  build:
    name: Build (CMake) - CPU / CUDA matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda: [false, true]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.cuda }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.cuda }}
          key: ${{ runner.os }}-build-${{ matrix.cuda }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-build-${{ matrix.cuda }}-

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config

      - name: Install CUDA toolkit (matrix.cuda == true)
        if: matrix.cuda == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Adjust ubuntu2204 below if your runner OS is different (ubuntu2004 / ubuntu2404)
          UBUNTU_CODENAME=ubuntu2204

          sudo apt-get update
          sudo apt-get install -y wget curl gnupg ca-certificates lsb-release

          # Add NVIDIA CUDA repository pin and key
          CUDA_PIN_URL="https://developer.download.nvidia.com/compute/cuda/repos/${UBUNTU_CODENAME}/x86_64/cuda-ubuntu${UBUNTU_CODENAME#ubuntu}.pin"
          if curl -fsSL "$CUDA_PIN_URL" -o /tmp/cuda.pin; then
            sudo mv /tmp/cuda.pin /etc/apt/preferences.d/cuda-repository-pin-600
          fi

          # Import NVIDIA GPG key and register repo (use apt signed-by keyring)
          curl -fsSL "https://developer.download.nvidia.com/compute/cuda/repos/${UBUNTU_CODENAME}/x86_64/3bf863cc.pub" | sudo gpg --dearmour -o /usr/share/keyrings/nvidia-cuda.gpg
          echo "deb [signed-by=/usr/share/keyrings/nvidia-cuda.gpg] https://developer.download.nvidia.com/compute/cuda/repos/${UBUNTU_CODENAME}/x86_64/ /" | sudo tee /etc/apt/sources.list.d/nvidia-cuda.list

          sudo apt-get update
          # Install the CUDA toolkit package (12-8). Change package name if you prefer a different version.
          sudo apt-get -y install cuda-toolkit-12-8 || {
            echo "cuda-toolkit-12-8 not available; attempting 'nvidia-cuda-toolkit' fallback"
            sudo apt-get -y install nvidia-cuda-toolkit || true
          }

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cuda }}" = "true" ]; then
            BUILD_DIR=build-cuda
          else
            BUILD_DIR=build-cpu
          fi
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -G Ninja -DHAVE_CUDA=${{ matrix.cuda }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cuda }}" = "true" ]; then
            BUILD_DIR=build-cuda
          else
            BUILD_DIR=build-cpu
          fi
          cmake --build "$BUILD_DIR" -- -j$(nproc)

      - name: Run tests (if available)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cuda }}" = "true" ]; then
            BUILD_DIR=build-cuda
          else
            BUILD_DIR=build-cpu
          fi
          if [ -f "$BUILD_DIR/CTestTestfile.cmake" ]; then
            cd "$BUILD_DIR" && ctest --output-on-failure
          else
            echo "No CTest tests found in $BUILD_DIR; skipping test run"
          fi

  clang-format:
    name: Clang-Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' '*.cu' '*.cuh' || true)
          if [ -z "$files" ]; then
            echo "No C/C++/CUDA files to check"
            exit 0
          fi
          echo "Checking formatting for files:"
          echo "$files"
          unformatted=0
          for f in $files; do
            if ! diff -u "$f" <(clang-format -style=file "$f") >/dev/null; then
              echo ""
              echo "File not formatted: $f"
              unformatted=1
            fi
          done
          if [ "$unformatted" -ne 0 ]; then
            echo ""
            echo "Some files are not formatted. Run: clang-format -i <file> or install a pre-commit hook."
            exit 1
          fi

          # Get the list of changed files (new and modified)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare against the base branch
            changed_files=$(git diff --name-only ${{ github.base_ref }}... | grep -E '\.(c|h|cpp|hpp|cc|cu|cuh)$' || true)
          else
            # For push events, compare against the previous commit
            changed_files=$(git diff --name-only HEAD~1 | grep -E '\.(c|h|cpp|hpp|cc|cu|cuh)$' || true)
          fi

          if [ -z "$changed_files" ]; then
            echo "No C/C++/CUDA files changed"
            exit 0
          fi

          echo "Checking formatting for changed files:"
          echo "$changed_files"

          unformatted=0
          for f in $changed_files; do
             if ! diff -u "$f" <(clang-format -style=file "$f") > /dev/null; then
              echo ""
              echo "File not formatted: $f"
              unformatted=1
             fi
          done

          if [ "$unformatted" -ne 0 ]; then
            echo ""
            echo "Some files are not formatted. Run: clang-format -i <file>"
            exit 1
          fi